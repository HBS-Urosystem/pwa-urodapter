# Approved language fix. The docx text is otherwise copied verbatim.
# build.py applies it after reading the docx; check.py applies it before comparing.
# Optional scope: approach (lying | shower | partner), step (step id), field (label | title | summary | body).
# A fix that matches nothing stops the build, so a new docx version cannot silently drop one.
#
# 2026-10-12: the final docx (Köves Béla) already contains the other 11 fixes approved on 2026-10-10.
# This one is left because the step label is an image in the docx, so the text cannot be edited there.
- find: Clean and disinfect the area
  replace: Wash and disinfect the area
  approach: shower
  step: disinfect
  field: label
